name: Build GM Speaker (BSP 6.1 kernel + partitions)

# 为什么换内核
#   现在这套 DTB 来源是这台机器 Android 真实运行的 FDT，硬件描述本身是对的。
#   问题是 ophub 的 6.1 是 mainline，不认里面的 vendor binding：
#     simple-panel-dsi + panel-init-sequence -> mainline panel-simple 里没这个 compatible
#                                               -> 面板 probe 失败 -> 无视频流 -> 背光亮=花屏
#     wlan-platdata / wifi_chip_type=rk960   -> 没有 RFKILL_RK，WiFi 没驱动
#     bluetooth-platdata                     -> 蓝牙没驱动
#     rockchip,dummy-codec + spk-ctl-gpios   -> 功放使能脚没人管，没声音
#     gslx680 / focaltech vendor 触摸         -> mainline 只有 edt-ft5x06，对不上
#     cpu0-opp-table + pvtm + pwm-regulator  -> mainline 起不了 rockchip cpufreq，
#                                               ARMCLK 就停在 uboot 留下的 816MHz（"CPU 被锁"）
#
#   换 Rockchip 官方 BSP 6.1 (develop-6.1, 6.1.172 LTS) 一次全解决，
#   而且自带 arch/arm64/configs/rockchip_linux_docker.config，docker 可用。
#
# 为什么不再出整盘镜像
#   原厂 uboot 是 Android 风格的验证链（SPL -> FIT(ATF/OPTE/U-Boot)，sha256+rsa2048），
#   且 GPT 是 Android 布局（boot 在 25MiB..65MiB）。
#   而 ophub 整盘镜像的 p1 在 180MiB —— 位置完全错位，
#   刷完 uboot 只会得到 "FIT: No fit blob"，这就是 ttl.txt 里看到的现象。
#
#   所以这里改成出「分区包」，只写 boot 和 rootfs 两个分区，
#   前 16MiB（security/uboot/trust + GPT 主表）一个字节都不碰：
#     boot  分区 : LBA 51200    (25MiB,  40MiB)  <- boot.img  (FIT: kernel+dtb)
#     rootfs分区 : LBA 8318976  (4062MiB, 约 28G)  <- rootfs.img (ext4)
#   刷坏了最多重写这 40MiB，不用再动安全区、不用拆 eMMC。

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Rockchip BSP kernel branch"
        required: true
        default: "develop-6.1"
      base_image_url:
        description: "Base Armbian image (.img.gz, 只取它的 rootfs)"
        required: true
        default: "https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_bookworm_arm64_server_2026.09/Armbian_26.11.0_rockchip_wxy-oect_bookworm_6.1.157_server_2026.09.14.img.gz"

permissions:
  contents: write

env:
  ARCH: arm64
  CROSS: aarch64-linux-gnu-
  # 本机 GPT 常量（来源：备份/mmcblk2-header.img，永不改变）
  # 用 PARTUUID 而不是 /dev/mmcblkXpY：eMMC 在 Android 里叫 mmcblk2，
  # 在现运行的 Armbian 里叫 mmcblk1，换个内核还可能变。PARTUUID 是 GPT 里的常量。
  ROOT_PARTUUID: "84120000-0000-4b2f-8000-0f5100000a64"   # p14 userdata
  BOOT_LBA: "51200"                                       # 25 MiB  boot
  ROOT_LBA: "8318976"                                     # 4062 MiB userdata

jobs:
  kernel:
    name: Build BSP 6.1 kernel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev lz4 zstd \
            device-tree-compiler kmod rsync python3 cpio gcc-aarch64-linux-gnu

      - name: Clone Rockchip BSP kernel
        env:
          BRANCH: ${{ inputs.kernel_branch }}
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$BRANCH" \
            https://github.com/rockchip-linux/kernel.git kern
          cd kern
          head -6 Makefile
          git log -1 --oneline

      - name: Configure (rk3566 + docker)
        run: |
          set -euxo pipefail
          cd kern
          make ARCH=$ARCH CROSS_COMPILE=$CROSS rockchip_linux_defconfig

          ./scripts/kconfig/merge_config.sh -m -O . .config \
            arch/arm64/configs/rk3566.config \
            arch/arm64/configs/rockchip_linux_docker.config

          make ARCH=$ARCH CROSS_COMPILE=$CROSS olddefconfig
          cp .config ../kernel.config

          echo "=== 关键符号自检 ==="
          MISSING=0
          for s in CONFIG_DRM_ROCKCHIP=y CONFIG_ROCKCHIP_DW_MIPI_DSI=y \
                   CONFIG_DRM_PANEL_SIMPLE=y CONFIG_SND_SOC_DUMMY_CODEC=y \
                   CONFIG_RFKILL_RK=y CONFIG_MMC_DW_ROCKCHIP=y \
                   CONFIG_MMC_SDHCI_OF_DWCMSHC=y CONFIG_EXT4_FS=y \
                   CONFIG_ROCKCHIP_CPUINFO=y CONFIG_ARM_ROCKCHIP_CPUFREQ=y \
                   CONFIG_OVERLAY_FS=y CONFIG_VETH=y CONFIG_BRIDGE=y \
                   CONFIG_MEMCG=y CONFIG_NAMESPACES=y CONFIG_SECCOMP=y \
                   CONFIG_BLK_CGROUP=y CONFIG_NF_TABLES=y; do
            if grep -qx "$s" .config; then echo "ok   $s"; else echo "MISS $s"; MISSING=$((MISSING+1)); fi
          done
          echo "missing=$MISSING"

      - name: Build Image + modules
        run: |
          set -euxo pipefail
          cd kern
          # BSP 内核遇到较新 gcc 常有 -Werror 误报，统一降级为警告
          make ARCH=$ARCH CROSS_COMPILE=$CROSS KCFLAGS="-Wno-error" \
               -j"$(nproc)" Image modules

          VER="$(make -s ARCH=$ARCH CROSS_COMPILE=$CROSS kernelrelease)"
          echo "$VER" > ../kernel.release
          echo "kernelrelease = $VER"

          make ARCH=$ARCH CROSS_COMPILE=$CROSS INSTALL_MOD_PATH="$PWD/../modout" \
               modules_install
          rm -f "../modout/lib/modules/$VER/build" "../modout/lib/modules/$VER/source"

          ls -l arch/arm64/boot/Image
          tar -C "$PWD/../modout" -czf ../modules.tar.gz lib
          ls -l ../modules.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: bsp-kernel
          if-no-files-found: error
          compression-level: 0
          path: |
            kern/arch/arm64/boot/Image
            kern/System.map
            modules.tar.gz
            kernel.release
            kernel.config

  package:
    name: Package boot.img + rootfs.img
    needs: kernel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bsp-kernel

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            device-tree-compiler u-boot-tools curl gzip util-linux mount \
            e2fsprogs kmod rsync xz-utils

      - name: Compile board DTB
        run: |
          set -euxo pipefail
          dtc -I dts -O dtb -o board.dtb dts/rk3566-guomeiyun.dts 2> dtc.warn || {
            grep -i error dtc.warn || cat dtc.warn; exit 1; }
          echo "dtb warnings: $(grep -c Warning dtc.warn || true) (不阻断)"
          test "$(od -An -tx1 -N4 board.dtb | tr -d ' \n')" = "d00dfeed"
          sha256sum board.dtb

      - name: Build FIT boot image
        run: |
          set -euxo pipefail
          VER="$(cat kernel.release)"
          echo "kernelrelease = $VER"

          mkdir -p fit
          cp kern/arch/arm64/boot/Image fit/Image
          gzip -9 -n -c fit/Image > fit/Image.gz
          cp board.dtb fit/board.dtb
          cp boot/boot.its fit/boot.its

          ls -l fit/
          ( cd fit && mkimage -f boot.its boot.img )
          ls -l fit/boot.img

          # 必须能塞进 40MiB 的 boot 分区
          SIZE="$(stat -c %s fit/boot.img)"
          echo "boot.img = $SIZE bytes"
          test "$SIZE" -lt $((40*1024*1024))
          mkimage -l fit/boot.img

      - name: Extract rootfs from base image
        env:
          URL: ${{ inputs.base_image_url }}
        run: |
          set -euxo pipefail
          mkdir -p work
          curl -fL "$URL" -o work/base.img.gz
          gzip -t work/base.img.gz
          gunzip -c work/base.img.gz > work/base.img
          rm -f work/base.img.gz

          LOOP="$(sudo losetup --find --show --partscan work/base.img)"
          trap 'sudo umount -R work/mnt 2>/dev/null || true; sudo losetup -d "$LOOP" 2>/dev/null || true' EXIT
          sudo mkdir -p work/mnt

          ROOTPART=""
          for p in "${LOOP}"p*; do
            [ -b "$p" ] || continue
            d="work/mnt/$(basename "$p")"
            sudo mkdir -p "$d"
            sudo mount -o ro "$p" "$d" 2>/dev/null || continue
            echo "--- $p ---"; sudo ls "$d" | head -12
            if sudo test -f "$d/etc/os-release"; then ROOTPART="$p"; echo ">>> rootfs"; break; fi
            sudo umount "$d" || true
          done

          test -n "$ROOTPART"
          sudo dd if="$ROOTPART" of=rootfs.img bs=1M conv=sparse status=progress
          sudo losetup -d "$LOOP"
          trap - EXIT
          ls -l rootfs.img

      - name: Install kernel into rootfs
        run: |
          set -euxo pipefail
          VER="$(cat kernel.release)"
          sudo mkdir -p work/rfs
          sudo mount -o loop rootfs.img work/rfs
          R=work/rfs

          # 内核模块
          MODDIR="$R/usr/lib/modules/$VER"
          if [ ! -d "$R/usr" ] && [ -d "$R/lib/modules" ]; then MODDIR="$R/lib/modules/$VER"; fi
          echo "模块目录: $MODDIR"
          sudo mkdir -p "$MODDIR"
          sudo tar -xzf modules.tar.gz -C "$MODDIR" --strip-components=2 "lib/modules/$VER"
          sudo cp -f kern/System.map "$MODDIR/System.map" 2>/dev/null || true
          sudo depmod -b "$R" "$VER" 2>&1 | tail -3 || true

          # fstab：用 PARTUUID 而不是 /dev/mmcblkXpY —— eMMC 在不同内核下可能叫
          # mmcblk0 / mmcblk1 / mmcblk2（Android 叫 mmcblk2，本机 Linux 实测是 mmcblk1），
          # 但 userdata 的 PARTUUID 是 GPT 里的常量，永远不变。
          # x-systemd.growfs 让它开机自动扩到分区大小。
          printf 'PARTUUID=%s  /  ext4  defaults,noatime,x-systemd.growfs  0 1\n' \
            "$ROOT_PARTUUID" | sudo tee "$R/etc/fstab" >/dev/null

          echo "gm-speaker" | sudo tee "$R/etc/hostname" >/dev/null
          sudo sed -i 's/^127\.0\.1\.1.*/127.0.1.1\tgm-speaker/' "$R/etc/hosts" || true

          # 串口控制台（console=ttyS2 已在内核 cmdline 里，这里再兜一层）
          sudo mkdir -p "$R/etc/systemd/system/getty.target.wants"
          sudo ln -sf /lib/systemd/system/serial-getty@.service \
            "$R/etc/systemd/system/getty.target.wants/serial-getty@ttyS2.service" || true

          sudo sync
          sudo umount work/rfs
          ls -l rootfs.img
          gzip -9 -c rootfs.img > rootfs.img.gz
          ls -l rootfs.img.gz

      - name: Verify
        run: |
          set -euxo pipefail
          echo "===== boot.img ====="
          mkimage -l fit/boot.img
          sha256sum fit/boot.img
          echo "===== rootfs.img.gz ====="
          sha256sum rootfs.img.gz
          echo "===== files ====="
          ls -l fit/boot.img rootfs.img.gz board.dtb kernel.release

      - uses: actions/upload-artifact@v4
        with:
          name: GM-Speaker-partitions
          if-no-files-found: error
          compression-level: 0
          path: |
            fit/boot.img
            rootfs.img.gz
            board.dtb
            kernel.release
            kernel.config
